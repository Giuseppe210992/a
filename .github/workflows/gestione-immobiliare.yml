# Gestione Immobiliare: prove automatiche e programma per Windows.
#
# Cosa fa a ogni modifica della cartella gestione-immobiliare/:
#   1. "prove"            esegue i test sui calcoli e le prove nel browser (ogni pulsante, persistenza, schermi, accessibilità);
#   2. "programma-windows" costruisce il programma per Windows (installatore e versione portatile), lo AVVIA davvero
#                          su Windows, ci inserisce dei dati, lo chiude, lo riapre e controlla che i dati ci siano ancora.
# I file pronti si scaricano dalla pagina dell'esecuzione (sezione "Artifacts") oppure, per i tag v*, dalla pagina "Releases".

name: Gestione Immobiliare

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'gestione-immobiliare/**'
      - '.github/workflows/gestione-immobiliare.yml'
  pull_request:
    paths:
      - 'gestione-immobiliare/**'
      - '.github/workflows/gestione-immobiliare.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: gestione-immobiliare

jobs:
  prove:
    name: Prove (calcoli e browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestione-immobiliare/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Prove sui calcoli e sull'archivio
        run: npm test

      - name: Installa il browser per le prove
        run: npx playwright-core install --with-deps chromium

      - name: Prove nel browser (tutte le schermate)
        run: npm run test:e2e

      - name: Interfaccia pronta da aprire nel browser
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Immobiliare-versione-browser
          path: gestione-immobiliare/dist/web
          if-no-files-found: error

  # Gira in parallelo alle prove nel browser: cosi' l'esito del programma per Windows si vede subito, anche se una prova del browser fallisce.
  programma-windows:
    name: Programma per Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestione-immobiliare/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Prepara l'interfaccia (dist/web)
        run: node build.mjs

      - name: Costruisci il programma (installatore e versione portatile)
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Elenco dei file prodotti
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Avvia il programma vero, inserisci dati, chiudi, riapri e controlla
        shell: pwsh
        run: |
          $env:GI_EXE = (Resolve-Path 'release/win-unpacked/Gestione Immobiliare.exe').Path
          node --test --test-timeout=300000 tests/electron/programma.e2e.mjs

      - name: Salva i file del programma
        uses: actions/upload-artifact@v4
        with:
          name: Gestione-Immobiliare-per-Windows
          path: |
            gestione-immobiliare/release/*.exe
          if-no-files-found: error

      # L'installatore vero: lo si esegue in silenzio, si avvia il programma installato (stessa prova di sopra) e lo si disinstalla.
      # Dopo il salvataggio dei file, cosi' i file restano scaricabili anche se questo passaggio dovesse fallire.
      - name: Installa con l'installatore, prova il programma installato e disinstalla
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release -Filter '*Installazione.exe' | Select-Object -First 1).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'GI-installato'
          Write-Host "Installo $setup in $dest"
          Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dest" -Wait
          $exe = Join-Path $dest 'Gestione Immobiliare.exe'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $exe)) { throw "L'installatore non ha creato $exe" }
          Get-ChildItem $dest | Select-Object Name | Format-Table -HideTableHeaders
          $env:GI_EXE = $exe
          node --test --test-timeout=300000 tests/electron/programma.e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "La prova del programma installato e' fallita" }
          $disinstalla = Join-Path $dest 'Uninstall Gestione Immobiliare.exe'
          if (-not (Test-Path $disinstalla)) { throw "Manca il programma di disinstallazione: $disinstalla" }
          Start-Process -FilePath $disinstalla -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "La disinstallazione non ha rimosso il programma" }
          Write-Host 'Installazione, prova e disinstallazione riuscite.'

      # La versione portatile vera, come su una chiavetta: si copia da sola in una cartella, si avvia e i dati devono nascere accanto a lei (non in Documenti).
      - name: Prova la versione portatile come se fosse su una chiavetta
        shell: pwsh
        run: |
          $portatile = (Get-ChildItem release -Filter '*Portatile.exe' | Select-Object -First 1).FullName
          $chiavetta = Join-Path $env:RUNNER_TEMP 'chiavetta'
          New-Item -ItemType Directory -Path $chiavetta -Force | Out-Null
          Copy-Item $portatile $chiavetta
          $copia = Join-Path $chiavetta (Split-Path $portatile -Leaf)
          $archivio = Join-Path $chiavetta 'Gestione Immobiliare - Dati\Dati\archivio.sqlite'
          $documenti = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Gestione Immobiliare'
          $esisteva = Test-Path $documenti
          Remove-Item Env:GESTIONE_IMMOBILIARE_DATI -ErrorAction SilentlyContinue
          $env:GESTIONE_IMMOBILIARE_SENZA_FINESTRE = '1'
          Write-Host "Avvio $copia"
          $p = Start-Process -FilePath $copia -PassThru
          for ($i = 0; $i -lt 180 -and -not (Test-Path $archivio); $i++) { Start-Sleep -Seconds 1 }
          $trovato = Test-Path $archivio
          & taskkill /PID $p.Id /T /F | Out-Null
          Get-Process -Name 'Gestione Immobiliare' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Get-ChildItem $chiavetta -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize -Wrap
          if (-not $trovato) { throw "La versione portatile non ha creato l'archivio accanto a se': $archivio" }
          if ((Get-Item $archivio).Length -lt 4096) { throw "L'archivio creato dalla versione portatile e' troppo piccolo" }
          if (-not $esisteva -and (Test-Path $documenti)) { throw "La versione portatile ha scritto dati anche in $documenti" }
          Write-Host 'Versione portatile: i dati sono nati accanto al programma e nulla e'' finito in Documenti.'

  pubblica:
    name: Pubblica la versione
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [prove, programma-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gestione-Immobiliare-per-Windows
          path: pacchetto
      - name: Crea la pagina della versione con i file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" pacchetto/*.exe \
            --repo "${{ github.repository }}" \
            --title "Gestione Immobiliare ${{ github.ref_name }}" \
            --notes "Programma per Windows: scarica il file \"Installazione\" per installarlo, oppure \"Portatile\" per usarlo senza installare. Windows può mostrare l'avviso \"Windows ha protetto il PC\" perché il programma non ha una firma a pagamento: premi \"Ulteriori informazioni\" e poi \"Esegui comunque\"."
